<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alura Books</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="conteiner">
            <input type="checkbox" id="menu" class="conteiner__botao">
            <label for="menu">
                <span class="cabecalho__menu-hamburguer conteiner__imagem""></span>
            </label>
            <ul class="lista-menu">
                <li class="lista-menu__titulo">Categorias</li>
                <li class="lista-menu__item">
                    <a href="#" class="lista-menu__link">PROGRAMAÇÃO</a>
                </li>
                <li class="lista-menu__item">
                    <a href="#" class="lista-menu__link">FRONT-END</a>
                </li>
                <li class="lista-menu__item">
                    <a href="#" class="lista-menu__link">INFRAESTRUTURA</a>
                </li>
                <li class="lista-menu__item">
                    <a href="#" class="lista-menu__link">BUSINESS</a>
                </li>
                <li class="lista-menu__item">
                    <a href="#" class="lista-menu__link">DESIGN & UX</a>
                </li>
            </ul>
            <img src="./assets/Logo.svg" alt="Logo da Alura Books" class="conteiner__imagem">
        </div>

        <div class="conteiner">
            <a href="#">
                <img src="./assets/Favoritos.svg" alt="Ícone de favoritos" class="conteiner__imagem">
            </a>
            <a href="#">
                <img src="./assets/Compras.svg" alt="Ícone de compras" class="conteiner__imagem">
            </a>
            <a href="#">
                <img src="./assets/Usuário.svg" alt="Ícone de usuário" class="conteiner__imagem">
            </a>
        </div>
    </header>

    <main>
        <section class="banner">
            <h2 class="banner__titulo">Já sabe por onde começar?</h2>
            <p class="banner__texto">Encontre em nossa estante o que precisa para seu desenvolvimento!</p>
            <input type="search" placeholder="Qual será sua próxima leitura?" class="banner__pesquisa">
        </section>

        <section class="carossel">
            <h2 class="carossel__titulo">ÚLTIMOS LANÇAMENTOS</h2>
            <!-- Slider main container -->
            <div class="swiper">
                <!-- If we need pagination -->
                <div class="swiper-pagination"></div>

                <!-- Additional required wrapper -->
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <img src="./assets/ApacheKafka.svg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./assets/Liderança.svg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./assets/Javascript.svg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./assets/Nodejs.svg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./assets/Portugol.svg" alt="">
                    </div>
                    <div class="swiper-slide">
                        <img src="./assets/Tuning.svg" alt="">
                    </div>
                </div>

                <!-- If we need navigation buttons -->
                <div class="swiper-button-prev"></div>
                <div class="swiper-button-next"></div>
            </div>
        </section>
    </main>

    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', {
            spaceBetween: 15,
            speed: 1000,
            slidesPerView: 2.25,
            centeredSlides: true,
            loop: true,
            pagination: {
                el: '.swiper-pagination',
                type: 'bullets',
            },
            autoplay: {
                delay: 5000,
            },
        });
    </script>
</body>
</html>
